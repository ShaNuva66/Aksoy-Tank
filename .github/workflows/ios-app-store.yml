name: iOS - App Store'a Yukle

on:
  workflow_dispatch:

concurrency:
  group: ios-app-store
  cancel-in-progress: false

permissions:
  contents: read

env:
  GODOT_VERSION: 4.6.2
  IOS_BUNDLE_ID: com.atalay.aksoytanks

jobs:
  build-and-upload:
    name: iOS build ve yukleme
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Apple bilgilerini denetle
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          IOS_DISTRIBUTION_CERTIFICATE_P12: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          missing=0
          for name in APPLE_TEAM_ID APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY IOS_DISTRIBUTION_CERTIFICATE_P12 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE; do
            if [[ -z "${!name:-}" ]]; then
              echo "Eksik GitHub secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Xcode bilgisini goster
        run: |
          set -euo pipefail
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: $sdk_version"
          if (( ${sdk_version%%.*} < 26 )); then
            echo "App Store yuklemesi icin iOS 26 SDK veya daha yenisi gerekli."
            exit 1
          fi

      - name: Godot ve iOS export sablonlarini kur
        run: |
          set -euo pipefail
          godot_zip="$RUNNER_TEMP/godot.zip"
          templates_zip="$RUNNER_TEMP/godot-templates.tpz"
          godot_dir="$RUNNER_TEMP/godot"
          templates_unpack="$RUNNER_TEMP/godot-templates"
          templates_dir="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"

          curl --fail --location --retry 3 \
            --output "$godot_zip" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          ditto -x -k "$godot_zip" "$godot_dir"

          curl --fail --location --retry 3 \
            --output "$templates_zip" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$templates_unpack" "$templates_dir"
          unzip -q "$templates_zip" -d "$templates_unpack"
          cp -R "$templates_unpack/templates/." "$templates_dir/"

          echo "GODOT_BIN=$godot_dir/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Apple API anahtarini hazirla
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key_dir="$HOME/.appstoreconnect/private_keys"
          key_path="$key_dir/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          mkdir -p "$key_dir"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Dagitim sertifikasi ve profilini kur
        env:
          IOS_DISTRIBUTION_CERTIFICATE_P12: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          export P12_PATH="$RUNNER_TEMP/distribution.p12"
          export PROFILE_PATH="$RUNNER_TEMP/app-store.mobileprovision"

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["P12_PATH"]).write_bytes(
              base64.b64decode(os.environ["IOS_DISTRIBUTION_CERTIFICATE_P12"])
          )
          Path(os.environ["PROFILE_PATH"]).write_bytes(
              base64.b64decode(os.environ["IOS_PROVISIONING_PROFILE"])
          )
          PY

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$P12_PATH" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"

          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          echo "IOS_PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$keychain_path"

      - name: iOS surum ayarlarini hazirla
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          sed -i '' "s/__APPLE_TEAM_ID__/${APPLE_TEAM_ID}/g" export_presets.cfg
          build_number=$((29 + GITHUB_RUN_NUMBER))
          echo "IOS_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          sed -i '' "s/__BUILD_NUMBER__/${build_number}/g" export_presets.cfg
          sed -e "s/__APPLE_TEAM_ID__/${APPLE_TEAM_ID}/g" \
            -e "s/__IOS_PROFILE_NAME__/${IOS_PROFILE_NAME}/g" \
            .github/export-options.plist.template > "$RUNNER_TEMP/ExportOptions.plist"
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Godot projesini denetle
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --editor --quit
          for test in validate_ios_source mobile_touch_smoke_test room_browser_test snapshot_codec_test; do
            "$GODOT_BIN" --headless --path . --script "res://tools/${test}.gd"
          done

      - name: Xcode projesini olustur
        run: |
          set -euo pipefail
          mkdir -p build/ios
          "$GODOT_BIN" --headless --path . \
            --export-release "iOS" "build/ios/AksoyTank.ipa"
          test -f build/ios/AksoyTank.xcodeproj/project.pbxproj

      - name: App Store arsivini olustur
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project build/ios/AksoyTank.xcodeproj \
            -scheme AksoyTank \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AksoyTank.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROFILE_NAME" \
            clean archive

      - name: Imzali IPA olustur
        run: |
          set -euo pipefail
          mkdir -p build/app-store
          xcodebuild \
            -exportArchive \
            -archivePath build/AksoyTank.xcarchive \
            -exportPath build/app-store \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          test -n "$(find build/app-store -maxdepth 1 -name '*.ipa' -print -quit)"

      - name: App Store Connect'e yukle
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          ipa_path="$(find build/app-store -maxdepth 1 -name '*.ipa' -print -quit)"
          xcrun altool \
            --upload-app \
            --file "$ipa_path" \
            --type ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: TestFlight islemesini ve dahili test erisimini dogrula
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/asc-python"
          "$RUNNER_TEMP/asc-python/bin/pip" install cryptography
          "$RUNNER_TEMP/asc-python/bin/python" tools/asc_testflight.py

      - name: IPA ve arsivi sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aksoy-tank-ios-${{ github.run_number }}
          path: |
            build/app-store/*.ipa
            build/AksoyTank.xcarchive
          if-no-files-found: ignore
          retention-days: 7
