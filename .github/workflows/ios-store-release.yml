name: iOS Store Release
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        default: audit
        options: [audit, prepare, submit, subtitles]
        description: Release action for tested 2.0.7 build 37
permissions:
  contents: read
concurrency:
  group: ios-store-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography
      - name: Inspect store release
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          RELEASE_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail
          export ASC_KEY_PATH="$RUNNER_TEMP/asc-release.p8"
          trap 'rm -f "$ASC_KEY_PATH"' EXIT
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          if [ "$RELEASE_ACTION" = "subtitles" ]; then
            python tools/asc_subtitles.py
          else
            python tools/asc_store_release.py
          fi
